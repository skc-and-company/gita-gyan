# Temporary: download the Bihar eProcurement "Latest Tenders" page on GitHub's
# runners and commit it to this branch, so the tenders parser can be written
# against the real page. Removed once scripts/build_tenders.py exists.
name: Probe tenders portal

on:
  push:
    branches: [claude/bihar-tenders]
    paths: [.github/workflows/probe-tenders.yml, scripts/probe_tenders_api.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The portal serves only its own certificate, without the intermediate.
      # Fetch the missing issuer(s) from the certificate's AIA "CA Issuers" URL
      # and verify against system roots + those intermediates (verification stays on).
      - name: Complete the certificate chain
        run: |
          mkdir -p probe chain
          H=eproc2.bihar.gov.in
          openssl s_client -connect $H:443 -servername $H -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERT/{n++} n==1{print} /END CERT/&&n==1{exit}' > chain/cert0.pem
          cp /etc/ssl/certs/ca-certificates.crt chain/bundle.pem
          cur=chain/cert0.pem
          for i in 1 2 3; do
            openssl x509 -in $cur -noout -subject -issuer | tee -a probe/chain.txt
            url=$(openssl x509 -in $cur -noout -ext authorityInfoAccess 2>/dev/null | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' | head -1)
            [ -n "$url" ] || break
            echo "issuer url: $url" | tee -a probe/chain.txt
            curl -sS -L -m 30 -o chain/issuer$i.raw "$url" || break
            openssl x509 -inform DER -in chain/issuer$i.raw -out chain/issuer$i.pem 2>/dev/null \
              || openssl x509 -in chain/issuer$i.raw -out chain/issuer$i.pem || break
            cat chain/issuer$i.pem >> chain/bundle.pem
            cur=chain/issuer$i.pem
            openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt chain/issuer$i.pem >/dev/null 2>&1 && break
          done
      - name: Call the API
        run: |
          pip install -q requests
          python scripts/probe_tenders_api.py chain/bundle.pem | tee probe/api.status
          ls -la probe
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "Probe: raw tenders portal response" || exit 0
          git push origin HEAD:claude/bihar-tenders
