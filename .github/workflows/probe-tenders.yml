# Temporary: download the Bihar eProcurement "Latest Tenders" page on GitHub's
# runners and commit it to this branch, so the tenders parser can be written
# against the real page. Removed once scripts/build_tenders.py exists.
name: Probe tenders portal

on:
  push:
    branches: [claude/bihar-tenders]
    paths: [.github/workflows/probe-tenders.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch listing
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B=https://eproc2.bihar.gov.in/EPSV2Web
          curl -sS -L -m 60 -A "$UA" -c probe/cookies.txt -D probe/listing.headers -o probe/listing.html "$B/openarea/tenderListingPage.action" -w "%{http_code} %{size_download} %{url_effective}\n" | tee probe/listing.status || true
          curl -sS -L -m 60 -A "$UA" -b probe/cookies.txt -D probe/home.headers -o probe/home.html "$B/" -w "%{http_code} %{size_download} %{url_effective}\n" | tee probe/home.status || true
          ls -la probe
      - name: Commit
        run: |
          rm -f probe/cookies.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "Probe: raw tenders portal response" || exit 0
          git push origin HEAD:claude/bihar-tenders
